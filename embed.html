<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapgen4 · Sphere</title>
<div style="width:auto">
<style>
    html, body { margin: 0; padding: 0; }
    button { text-align: center; padding: 0; background: hsl(60,20%,90%); border-radius: 4px; cursor: pointer; }
    button svg { width: 100%; height: 100%; }
    button text { text-anchor: middle; font-size: 24px; font-family: var(--sans-serif, Arial); }
    button.current-control { background: hsl(60,100%,80%); outline: 2px solid hsl(220,50%,50%); }
    button:focus { outline: none; }
    input[type="range"] { cursor: ew-resize; margin-left: 0; margin-right: 0; accent-color: hsl(0, 50%, 50%); }
    button:disabled, input:disabled { cursor: unset; opacity: 0.25; }
    #ui {
        display: grid;
        min-height: calc(100vmin - 130px);
        grid-template-rows: repeat(3, 40px) calc(100vmin - 130px - 120px - 40px);
        grid-template-columns: 1fr calc(100vmin - 130px) repeat(4, 30px) 1fr;
        grid-row-gap: 10px;
        grid-column-gap: 10px;
    }
    #map        { grid-area: 1 / 2 / span 4 / span 1; width:100%; height:100%; }
    #tiny       { grid-area: 1 / 3 / span 1 / span 1; }
    #small      { grid-area: 1 / 4 / span 1 / span 1; }
    #medium     { grid-area: 1 / 5 / span 1 / span 1; }
    #large      { grid-area: 1 / 6 / span 1 / span 1; }
    #ocean      { grid-area: 2 / 3 / span 1 / span 2; }
    #shallow    { grid-area: 2 / 5 / span 1 / span 2; }
    #valley     { grid-area: 3 / 3 / span 1 / span 2; }
    #mountain   { grid-area: 3 / 5 / span 1 / span 2; }
    #sliders    { grid-area: 4 / 3 / span 1 / span 4; overflow-y: scroll; overflow-x: clip; line-height: 1.1; }

    @media (orientation: portrait) {
        /* Put the buttons on bottom instead of on the right */
        #ui {
            grid-template-rows: calc(100vmin) repeat(4, 40px) 1fr;
            grid-template-columns: 70px 70px calc(100vmin - 50px - 140px - 40px);
        }
        #map { grid-area: 1 / 1 / span 1 / span 6; }
        #tiny { grid-area: 2 / 1 / span 1 / span 1; }
        #small { grid-area: 3 / 1 / span 1 / span 1; }
        #medium { grid-area: 4 / 1 / span 1 / span 1; }
        #large { grid-area: 5 / 1 / span 1 / span 1; }
        #ocean { grid-area: 2 / 2 / span 1 / span 1; }
        #shallow { grid-area: 3 / 2 / span 1 / span 1; }
        #valley { grid-area: 4 / 2 / span 1 / span 1; }
        #mountain { grid-area: 5 / 2 / span 1 / span 1; }
        #sliders { grid-area: 2 / 3 / span 5 / span 1; justify-self: end; width: 100%; column-width: 20ch; }
    }

    #mapgen4 { width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
    #button-navigate { width: 100%; height: 2em; margin-top: 4px; }
    #sliders h3 {
        background-color: hsl(60,20%,90%);
        margin: 0.5em 0;
        padding: 0.5em;
        font-family: var(--sans-serif, sans-serif);
        font-size: 66%;
    }
    #sliders label {
        display: block;
        font-size: 66%;
    }
    #sliders label > * {
        max-width: 99%;
    }
    #sliders label span {
        font-family: var(--monospace, monospace);
        display: inline-block;
        width: 17ch;
    }
    #sliders #slider-sphere_radius span { width: auto; }
    #slider-sphere_radius .radius-value { float: right; }
    #planet-controls { font-family: var(--sans-serif, Arial); font-size: 11px; line-height: 1.35; }
    #planet-controls h3 { font-size: 11px; }
    #planet-controls label { font-size: inherit; margin: 6px 0; }
    #planet-controls label span { width: auto; display: block; font-family: inherit; }
    #planet-controls input:not([type="checkbox"]), #planet-controls select { box-sizing: border-box; width: 100%; min-width: 0; font-size: 11px; }
    #planet-controls button { width: 100%; min-height: 26px; margin: 3px 0; font-size: 11px; }
    #planet-controls button[aria-pressed="true"] { background: hsl(60,100%,80%); }
    #planet-controls output { display: block; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    #planet-controls details { margin-top: 8px; break-inside: avoid; }
    #planet-controls summary { cursor: pointer; background: hsl(60,20%,90%); padding: 5px 2px; }
    #planet-controls .planet-note { margin: 6px 0; color: #555; font-size: 10px; overflow-wrap: anywhere; }
    #planet-controls .planet-info-row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
    #planet-controls .planet-info-row > label, #planet-controls .planet-info-row > button:not(.planet-info) { flex: 1; min-width: 0; margin: 0; }
    #planet-controls button.planet-info { flex: none; width: 20px; height: 20px; min-height: 20px; margin: 0; border: 1px solid #829092; border-radius: 50%; background: transparent; color: #526467; font: italic bold 13px Georgia,serif; }
    #planet-controls button.planet-info:hover, #planet-controls button.planet-info:focus-visible { color: #172f38; border-color: #172f38; background: #e8eef0; }
    #planet-controls summary:has(> .planet-info) { position: relative; padding-right: 25px; }
    #planet-controls summary > .planet-info { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; min-height: 18px; margin: 0; }
    #planet-controls .planet-tooltip { position: fixed; inset: auto; box-sizing: border-box; width: min(320px,calc(100vw - 24px)); max-height: min(420px,70vh); margin: 0; padding: 13px 15px; overflow: auto; border: 1px solid #4d626e; border-radius: 9px; background: #182b35; color: #eff5f7; box-shadow: 0 6px 24px #0004; font: 12px/1.55 var(--sans-serif,Arial); }
    #planet-controls .planet-tooltip strong { display: block; margin-bottom: 7px; font-size: 12px; }
    #planet-controls .planet-tooltip .planet-note { display: block; margin: 8px 0 0; color: #d7e3e8; font-size: 12px; }
    #planet-controls .planet-tooltip::backdrop { background: transparent; pointer-events: none; }
    #planet-biome-key:not([hidden]) { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 8px 0; font-size: 10px; }
    #planet-biome-key span { display: inline-flex; align-items: center; gap: 4px; }
    #planet-biome-key i { width: 10px; height: 10px; border: 1px solid #0003; border-radius: 2px; flex: none; }
    #planet-controls input[aria-invalid="true"] { outline: 2px solid #a22; }
    #planet-controls :focus-visible { outline: 2px solid #466aa0; outline-offset: 1px; }
    #planet-model-note:empty { display: none; }
    @media (orientation: portrait) {
        #sliders { align-self: start; max-height: max(200px, calc(100dvh - 100vw - 20px)); column-width: auto; }
    }
    #button-reset {
        display: inline-block;
        margin-left: auto;
        margin-right: auto;
        width: 100%;
        height: 2em;
    }
</style>

  <div id="ui">
  
  <button id="tiny"><svg viewBox="-50 -50 100 100"><circle r="7"/></svg></button>
  <button id="small"><svg viewBox="-50 -50 100 100"><circle r="20"/></svg></button>
  <button id="medium"><svg viewBox="-50 -50 100 100"><circle r="35"/></svg></button>
  <button id="large"><svg viewBox="-50 -50 100 100"><circle r="50"/></svg></button>
  
  <button id="ocean" title="Ocean"><svg viewBox="-50 -50 100 100"><text y="45">Ocean</text><path d="M -50,-30 q 25,-20 50,0 q 25,20 50,0 l 0,50 l -100,0 z" fill="hsl(240,50%,40%)"/></svg></button>
  <button id="shallow" title="Water"><svg viewBox="-50 -50 100 100"><text y="45">Water</text><path d="M -50,-20 q 15,20 30,0 q 20,20 40,0 q 15,20 30,0 l 0,40 l -100,0 z" fill="hsl(200,50%,70%)"/></svg></button>
  <button id="valley" title="Valley"><svg viewBox="-50 -50 100 100"><text y="45">Valley</text><path d="M -50,-20 c 20,10 80,10 100,0 l 0,40 l -100,0 z" fill="hsl(100,40%,60%)"/></svg></button>
  <button id="mountain" title="Mountain"><svg viewBox="-50 -50 100 100"><text y="45">Mountains</text><g fill="hsl(60,50%,40%)" stroke="white" stroke-width="2"><path d="M -30,20 l 30,-60 l 30,60 z"/><path d="M -50,20 l 20,-40 l 20,40 z"/><path d="M 10,20 l 15,-30 l 15,30 z"/></g></svg></button>

  <div id="sliders">
    <button id="button-reset">Reset</button>
    <button id="button-navigate" aria-pressed="false" title="Left drag paints. Right or Alt-drag rotates. Wheel zooms. Use this toggle to rotate with touch.">Drag: Paint</button>
  </div>
  
  <div id="map"><canvas id="mapgen4" width="2048" height="2048" aria-label="Editable spherical terrain" title="Paint: left drag · Rotate: right / Alt-drag · Zoom: wheel. Touch: toggle Drag mode."></canvas></div>
  </div>
  <script defer="defer" src="build/_bundle.js"></script>
</div>
