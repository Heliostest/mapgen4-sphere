<table><thead><tr><th>全球平均</th><th>现有</th><th>Exo</th><th>差值</th></tr></thead><tbody id="metrics"></tbody></table>
<p class="muted">气温：现有模型为单层空气变量，ExoPlaSim 为 2 米气温。风：现有单层风与 ExoPlaSim 最低 sigma 层风；它们并非同一观测高度。</p>
<p class="muted">两者使用同一份导出的物理地形与对应季节，初始温湿度、雪冰及物理闭合各自不同。首年差异包含初始化调整，不能作为平衡气候准确性结论。</p>
